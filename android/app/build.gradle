plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.hozdogus.boxdroid'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.hozdogus.boxdroid'
        minSdk 29
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "0.1." + (System.getenv('GITHUB_RUN_NUMBER') ?: 'dev')
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Debug key stored in the repo so every CI build can update the last one in place.
    signingConfigs {
        ci {
            storeFile file('ci-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.ci
            jniDebuggable false
        }
        release {
            signingConfig signingConfigs.ci
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
